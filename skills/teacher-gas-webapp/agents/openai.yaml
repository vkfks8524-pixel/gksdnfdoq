interface:
  display_name: "교사용 Apps Script 웹앱 제작"
  short_description: "인터뷰로 첫 버전을 만들고 피드백을 반영하며 웹앱·배포·사용 설명서를 갱신합니다."
  default_prompt: "$teacher-gas-webapp 스킬로 스크립트 ID 확인과 클론부터 시작하고, 핵심 기능·디자인이 정리되면 MVP를 만들어 피드백으로 보완해줘. 최종 기록은 시트에 저장하고 RTDB는 실시간 반영에만 사용해줘. 코드 변경마다 한국어 README를 갱신하고 같은 주소로 배포한 뒤, 직접 테스트하는 대신 화면별 링크와 사용자 점검 체크리스트를 제공해줘."
