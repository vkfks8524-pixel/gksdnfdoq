interface:
  display_name: "gksdnfdoq · 교사용 도구 제작"
  short_description: "인터뷰로 웹앱·실행 프로그램을 만들고 진행 기록으로 개발을 이어갑니다."
  default_prompt: "$gksdnfdoq 스킬로 만들고 싶은 도구와 사용 상황부터 함께 정리해줘. 적합한 실행 형태를 판단하고 Apps Script 웹앱으로 정한 경우에만 스크립트 ID를 받아 준비해줘. 핵심 기능·디자인으로 첫 버전을 만들고 피드백으로 보완해줘. 한국어 README와 진행 기록을 갱신하고, 제작 방식에 맞는 접속 링크나 실행 파일과 사용자 점검 체크리스트를 제공해줘."
